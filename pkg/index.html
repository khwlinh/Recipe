<style>
:root{--bg:#d9c7a3;--ink:#3b2f22;--paper:#f7edcf;--line:#c7d3e6;--red:#c4493a;--green:#4d6b3a;--soft:#8a7556;--chip:#ecdcae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2218;--ink:#3b2f22;--soft:#8a7556}}
:root[data-theme="dark"]{--bg:#2a2218}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:'Itim','Comic Sans MS',cursive,sans-serif;color:var(--ink);min-height:100vh;
background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1px);background-size:14px 14px}
.wrap{max-width:540px;margin:0 auto;padding:14px 14px 96px}
h1{margin:6px 4px 2px;font-size:26px;color:#f7edcf;text-shadow:1px 2px 0 rgba(0,0,0,.3);transform:rotate(-1deg)}
.sub{margin:0 4px 14px;color:#e9dcb8;font-size:14px}
.paper{position:relative;background:var(--paper);border-radius:3px;padding:18px 16px 16px 16px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 24px rgba(0,0,0,.25);transform:rotate(.6deg);
clip-path:polygon(0 1%,3% 0,7% 1.2%,12% 0,19% 1%,27% 0,36% 1.2%,45% 0,55% 1%,64% 0,73% 1.2%,82% 0,91% 1%,100% 0,100% 100%,0 100%)}
.paper:before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:rgba(196,73,58,.45)}
.paper:after{content:"";position:absolute;right:26px;bottom:60px;width:70px;height:70px;border-radius:50%;border:5px solid rgba(120,70,30,.1);pointer-events:none}
.stamp{position:absolute;right:10px;top:8px;border:2px solid var(--red);color:var(--red);padding:1px 8px;font-size:13px;letter-spacing:1px;transform:rotate(8deg);opacity:.75;border-radius:3px}
textarea,input[type=text]{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);font-size:18px;line-height:32px;padding:0 0 0 30px;resize:none}
textarea{min-height:224px;background-image:linear-gradient(transparent 31px,var(--line) 31px);background-size:100% 32px;background-attachment:local}
textarea::placeholder,input::placeholder{color:#a8967a}
.first-hint{font-size:13px;color:var(--soft);padding-left:30px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:30px;margin:8px 0}
.chip{background:var(--chip);border:1px dashed #b39a62;border-radius:14px;padding:2px 10px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.row{display:flex;gap:8px;padding-left:30px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{font-size:14px;padding:3px 10px}
.tips{margin:6px 0 0 30px;padding:8px 10px;background:rgba(255,255,255,.45);border-radius:6px;font-size:14px}
.tips b{color:var(--green)}
.tips li{margin:3px 0}
.nag{background:#fff4c2;border:2px dashed var(--red);border-radius:8px;padding:10px 12px;margin-bottom:14px;transform:rotate(-.6deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.nag p{margin:0 0 8px;font-size:16px}
.card{background:var(--paper);border-radius:4px;padding:12px 14px 12px 30px;margin-bottom:12px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15);background-image:linear-gradient(transparent 27px,var(--line) 27px);background-size:100% 28px}
.card:before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:rgba(196,73,58,.4)}
.card h3{margin:0;font-size:19px;line-height:28px;cursor:pointer}
.meta{font-size:13px;color:var(--soft);line-height:28px}
.done{color:var(--green)}
.body{white-space:pre-wrap;line-height:28px;font-size:16px;margin:4px 0}
.card .chips{padding-left:0}
.empty{color:#e9dcb8;text-align:center;padding:30px 10px}
.miss{font-size:13px;color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(42,34,24,.92)}
nav button{font:inherit;font-size:16px;flex:1;max-width:170px;border:2px solid #f7edcf;background:transparent;color:#f7edcf;border-radius:10px;padding:7px 4px;cursor:pointer}
nav button.on{background:#f7edcf;color:#3b2f22}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none}
details summary{cursor:pointer;font-size:15px;color:var(--green)}
.mine{background:#fff4c2;border-radius:6px;padding:2px 8px;margin:3px 0;font-size:14px}
.std{color:#6b5a40;font-size:13px;margin:2px 0}
.lnk{font:inherit;font-size:13px;background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;padding:0}
.ed{margin:6px 0 8px}
.ed textarea{min-height:60px;background:#fff;background-image:none;border:1px solid #b39a62;border-radius:6px;padding:4px 8px;line-height:22px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sổ Công Thức Bâng Quơ</h1>
  <p class="sub">Ghi liền tên món, xuống dòng là lưu. Khỏi nhớ, khỏi sợ.</p>
  <div id="nag"></div>

  <section id="t-note">
    <div class="paper">
      <span class="stamp">MỚI TRỘM</span>
      <textarea id="note" spellcheck="false" placeholder="Tên món (dòng đầu)&#10;xuống dòng: nguyên liệu, các bước...&#10;ví dụ: gà kho gừng&#10;gà, gừng, nước mắm, 25 phút"></textarea>
      <p class="first-hint">Dòng đầu = tên món. Ctrl/⌘ + Enter để lưu nhanh.</p>
      <div id="live"></div>
      <div class="row">
        <button class="btn" id="saveBtn">Lưu nhanh</button>
        <button class="btn ghost" id="clearBtn">Xóa trắng</button>
      </div>
    </div>
  </section>

  <section id="t-book" class="hide">
    <div class="row" style="padding-left:0;margin:0 0 12px">
      <button class="btn sm ghost" id="exportBtn" style="background:#f7edcf">⬇ Xuất sổ</button>
      <label class="btn sm ghost" style="background:#f7edcf;cursor:pointer">⬆ Nhập sổ<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    </div>
    <div id="book"></div></section>

  <section id="t-fridge" class="hide">
    <div class="paper">
      <span class="stamp">TỦ LẠNH</span>
      <input type="text" id="fridge" placeholder="Trong tủ có: gà, gừng, trứng...">
      <p class="first-hint">Gõ nguyên liệu, cách nhau dấu phẩy. Hoặc bấm gợi ý:</p>
      <div class="chips" id="quick"></div>
    </div>
    <div id="results" style="margin-top:16px"></div>
  </section>
</div>

<nav>
  <button data-tab="note" class="on">✍️ Ghi</button>
  <button data-tab="book">📒 Sổ <span id="cnt"></span></button>
  <button data-tab="fridge">🧊 Tủ lạnh</button>
</nav>
<div class="toast" id="toast"></div>

];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const has=(t,n)=>new RegExp('(?<![\\p{L}])'+n+'(?![\\p{L}])','u').test(t);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function find(text){
  const lo=text.toLowerCase(),nt=norm(text),out=[];
  for(const it of ING){
    if(it[0].some(n=>has(lo,n)||(n.length>=5&&has(nt,norm(n))))) out.push({names:it[0],label:it[1],tip:it[2]});
  }
  return out.filter(f=>!out.some(o=>o.label.startsWith(f.label+' ')));
}
function split(text){
  const lines=text.split('\n').map(s=>s.trim());
  const i=lines.findIndex(Boolean);
  if(i<0) return {title:'',body:''};
  return {title:lines[i],body:lines.slice(i+1).filter(Boolean).join('\n')};
}

const KEY='bq-recipes-v1';
function seed(){
  const t=Date.now()-3*DAY;
  return [
    {id:1,created:t,cooked:0,text:'Gà kho gừng\ngà 500g, gừng, hành tím, nước mắm, đường\nướp gà với nước mắm + đường 15 phút\nphi hành tím, cho gà vào xào săn\nthêm gừng + nước, kho lửa nhỏ 25 phút'},
    {id:2,created:t+DAY,cooked:0,text:'Trứng chiên cà chua\ntrứng, cà chua, hành lá\nxào cà chua cho mềm\nđổ trứng đã đánh vào, rắc hành lá'},
    {id:3,created:t+2*DAY,cooked:1,lastCooked:Date.now()-DAY,text:'Canh bí đao tôm\ntôm, bí đao, hành lá\nxào tôm cho thơm\nthêm nước, cho bí vào nấu 10 phút'}
  ];
}
let R=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))return v}catch(e){}return seed()})();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
let editId=null;

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

function tab(n){
  for(const k of ['note','book','fridge']) $('#t-'+k).classList.toggle('hide',k!==n);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  if(n==='book') renderBook(); if(n==='fridge') renderFridge();
  scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

/* Ghi chú sơ chế riêng + gợi ý theo kiểu món */
const TKEY='bq-mytips-v1';
let T=(()=>{try{const v=JSON.parse(localStorage.getItem(TKEY));if(v&&typeof v==='object'&&!Array.isArray(v))return v}catch(e){}return {}})();
const persistT=()=>{try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}};
const OPEN=new Set();
const CAT={meat:['Gà','Thịt heo','Thịt bò','Vịt','Xương'],sea:['Tôm','Mực','Cá','Cá hồi','Cua ghẹ','Nghêu sò','Lươn'],
veg:['Cà chua','Cà tím','Cà rốt','Khoai tây','Rau muống','Rau cải','Bí','Mướp','Giá đỗ','Cải thảo','Bắp cải','Súp lơ','Dưa leo','Bí đỏ','Su su','Su hào','Củ cải','Khoai lang','Khoai môn','Măng','Ngô','Ớt chuông','Đậu cove','Đậu bắp','Đậu hà lan','Rau ngót','Mồng tơi','Rau dền','Nấm','Nấm hương','Nấm rơm','Nấm kim châm','Hành tây']};
const cat=l=>Object.keys(CAT).find(k=>CAT[k].includes(l));
const METHODS=[['kho',['kho','rim']],['chiên',['chiên','rán']],['xào',['xào']],['canh',['canh','súp','lẩu']],['luộc',['luộc','hấp']],['nướng',['nướng']],['gỏi',['gỏi','trộn','nộm']]];
const HINT={
kho:{meat:'Cắt miếng vừa ăn, ướp nước mắm + đường 15 phút cho thấm rồi mới kho.',sea:'Để nguyên khúc, ướp tiêu + chút nước màu. Kho lửa nhỏ, đừng khuấy kẻo nát.'},
chiên:{meat:'Thấm thật khô, ướp muối tiêu. Chảo nóng dầu mới thả vào để khỏi dính.',sea:'Thấm thật khô, lăn qua chút bột cho vỏ giòn. Mỗi mặt vàng rồi mới lật.',veg:'Cắt đều tay cho chín cùng lúc, thấm khô trước khi cho vào chảo.'},
xào:{meat:'Cắt mỏng, ướp 10 phút. Xào lửa lớn, chia nhiều lần cho khỏi ra nước.',sea:'Xào nhanh lửa lớn, vừa chín tới là tắt bếp.',veg:'Cắt đều, để thật ráo nước, xào lửa lớn nhanh tay cho giòn.'},
canh:{meat:'Chần sơ rồi mới nấu để nước canh trong, ít bọt.',sea:'Cho vào khi nước đã sôi, nấu vừa chín là tắt.',veg:'Cắt miếng vừa ăn. Rau lá cho vào cuối cùng để giữ màu xanh.'},
luộc:{meat:'Cho cả miếng vào nước có gừng + muối. Chín thì ngâm nước đá cho da giòn.',sea:'Hấp hoặc luộc với gừng, sả; đổi màu là vừa, đừng để lâu.',veg:'Nước sôi mới cho rau, thêm chút muối cho xanh.'},
nướng:{meat:'Ướp ít nhất 30 phút, để ra ngoài 15 phút cho hết lạnh rồi mới nướng.',sea:'Quét ít dầu, ướp muối tiêu, chỉ lật một lần.',veg:'Cắt dày, quét dầu, nướng tới khi viền hơi cháy xém.'},
gỏi:{meat:'Luộc chín, để nguội rồi xé hoặc thái mỏng.',veg:'Rửa kỹ, ngâm nước đá cho giòn, để thật ráo mới trộn.'}};
function getMethod(text){
  const tl=split(text).title.toLowerCase(),bl=text.toLowerCase();
  for(const src of [tl,bl]) for(const m of METHODS) if(m[1].some(w=>has(src,w))) return m[0];
  return null;
}
function tipsHTML(f,r,text){
  const m=getMethod(text);
  return f.map(i=>{
    const dish=r&&r.prep&&r.prep[i.label],mine=T[i.label],h=m&&HINT[m]&&HINT[m][cat(i.label)];
    let s='<li><b>'+esc(i.label)+':</b> '+esc(i.tip);
    if(h)s+='<div class="std">💡 Món '+m+': '+esc(h)+'</div>';
    if(mine)s+='<div class="mine">⭐ Của tui: '+esc(mine)+'</div>';
    if(dish)s+='<div class="mine">📌 Món này: '+esc(dish)+'</div>';
    if(r){const d='data-id="'+r.id+'" data-ing="'+esc(i.label)+'"';
      s+='<button class="lnk" data-act="ptip" '+d+'>✎ ghi chú riêng</button>'+
      '<div class="ed hide"><textarea placeholder="Cách sơ chế theo ý bạn..." spellcheck="false">'+esc(dish||mine||'')+'</textarea>'+
      '<div class="row" style="padding-left:0"><button class="btn sm" data-act="pdish" '+d+'>Lưu cho món này</button><button class="btn sm ghost" data-act="pall" '+d+'>Lưu cho mọi món</button></div>'+
      '<div class="std">Để trống rồi bấm lưu = xóa ghi chú đó.</div></div>';}
    return s+'</li>';
  }).join('');
}
const redraw=()=>{renderNag();if(!$('#t-book').classList.contains('hide'))renderBook();if(!$('#t-fridge').classList.contains('hide'))renderFridge();live()};

/* Nhắc nấu */
function renderNag(){
  const now=Date.now();
  const r=R.filter(x=>!x.cooked&&now-x.created>DAY&&(!x.snooze||x.snooze<now)).sort((a,b)=>a.created-b.created)[0];
  const el=$('#nag');
  if(!r){el.innerHTML='';return}
  const d=Math.floor((now-r.created)/DAY);
  el.innerHTML='<div class="nag"><p>🍳 “'+esc(split(r.text).title)+'” lưu '+d+' ngày rồi. Lưu công thức rồi có nấu không pà?</p>'+
  '<button class="btn sm" data-act="cooked" data-id="'+r.id+'">Nấu rồi ✓</button> '+
  '<button class="btn sm ghost" data-act="snooze" data-id="'+r.id+'">Chưa, mai nấu</button></div>';
}

/* Ghi nhanh */
function live(){
  const v=$('#note').value,{title,body}=split(v),f=find(v);
  let h='';
  if(f.length){
    h='<div class="chips">'+f.map(i=>'<span class="chip">'+esc(i.label)+'</span>').join('')+'</div>'+
    '<ul class="tips">'+tipsHTML(f,null,v)+'</ul>';
  } else if(title) h='<p class="first-hint">Chưa thấy nguyên liệu quen. Cứ ghi thêm bên dưới nhé.</p>';
  $('#live').innerHTML=h;
}
$('#note').addEventListener('input',live);
$('#note').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();saveNote()}});
function saveNote(){
  const v=$('#note').value.trim();
  if(!split(v).title){toast('Ghi tên món trước đã nha');return}
  if(editId){const r=R.find(x=>x.id===editId);if(r)r.text=v;editId=null}
  else R.unshift({id:Date.now(),created:Date.now(),cooked:0,text:v});
  persist();$('#note').value='';live();updateCount();renderNag();toast('Đã lưu vào sổ ✓');
}
$('#saveBtn').onclick=saveNote;
$('#clearBtn').onclick=()=>{$('#note').value='';editId=null;live()};

/* Sổ */
function recipeCard(r,extra){
  const {title,body}=split(r.text),f=find(r.text);
  const st=r.cooked?'<span class="done">✓ đã nấu '+r.cooked+' lần</span>':'chưa nấu lần nào';
  return '<div class="card"><h3 data-act="toggle" data-id="'+r.id+'">'+esc(title)+'</h3>'+
  '<div class="meta">'+st+(extra||'')+'</div>'+
  '<div class="chips">'+f.map(i=>'<span class="chip">'+esc(i.label)+'</span>').join('')+'</div>'+
  '<div class="dt'+(OPEN.has(r.id)?'':' hide')+'"><div class="body">'+esc(body)+'</div>'+
  (f.length?'<details open><summary>Sơ chế cho đứa khù khờ</summary><ul class="tips" style="margin-left:0">'+tipsHTML(f,r,r.text)+'</ul></details>':'')+
  '<div class="row" style="padding-left:0"><button class="btn sm" data-act="cooked" data-id="'+r.id+'">Mới nấu ✓</button>'+
  '<button class="btn sm ghost" data-act="edit" data-id="'+r.id+'">Sửa</button>'+
  '<button class="btn sm ghost" data-act="del" data-id="'+r.id+'">Xóa</button></div></div></div>';
}
function renderBook(){
  $('#book').innerHTML=R.length?R.map(r=>recipeCard(r)).join(''):'<p class="empty">Sổ trống trơn. Qua tab Ghi viết món đầu tiên đi.</p>';
}
const updateCount=()=>{$('#cnt').textContent=R.length?'('+R.length+')':''};

/* Tủ lạnh */
function renderFridge(){
  const q=$('#fridge').value,tokens=q.split(/[,;\n]/).map(s=>norm(s.trim())).filter(Boolean);
  const qc=$('#quick');
  if(!qc.children.length) qc.innerHTML=ING.filter(i=>i[1]!=='Hành').slice(0,24).map(i=>'<button class="chip" data-add="'+esc(i[0][0])+'">'+esc(i[1])+'</button>').join('');
  qc.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',tokens.includes(norm(c.dataset.add))));
  const box=$('#results');
  if(!tokens.length){box.innerHTML='<p class="empty">Nhập vài nguyên liệu, tui gợi ý món gần nhất.</p>';return}
  const res=R.map(r=>{
    const nt=norm(r.text),f=find(r.text);
    const hit=tokens.filter(t=>nt.includes(t)).length;
    const miss=f.filter(i=>!tokens.some(t=>i.names.some(n=>norm(n).includes(t)||t.includes(norm(n)))));
    return {r,hit,miss,total:f.length};
  }).filter(x=>x.hit>0).sort((a,b)=>b.hit-a.hit||a.miss.length-b.miss.length);
  box.innerHTML=res.length?res.map(x=>recipeCard(x.r,x.miss.length?'<br><span class="miss">thiếu: '+esc(x.miss.map(m=>m.label).join(', '))+'</span>':'<br><span class="done">đủ nguyên liệu, nấu liền!</span>')).join(''):'<p class="empty">Chưa có món nào hợp. Qua tab Ghi thêm món mới nha.</p>';
}
$('#fridge').addEventListener('input',renderFridge);
$('#quick').addEventListener('click',e=>{
  const a=e.target.dataset.add;if(!a)return;
  const inp=$('#fridge'),list=inp.value.split(/[,;]/).map(s=>s.trim()).filter(Boolean),i=list.findIndex(s=>norm(s)===norm(a));
  if(i>=0)list.splice(i,1);else list.push(a);
  inp.value=list.join(', ');renderFridge();
});

/* Hành động chung */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=+b.dataset.id,r=R.find(x=>x.id===id),a=b.dataset.act;
  if(a==='toggle'){const c=b.closest('.card'),d=c&&c.querySelector('.dt');if(d){d.classList.toggle('hide');if(d.classList.contains('hide'))OPEN.delete(id);else OPEN.add(id)}return}
  if(!r)return;
  if(a==='ptip'){const ed=b.closest('li').querySelector('.ed');ed.classList.toggle('hide');if(!ed.classList.contains('hide'))ed.querySelector('textarea').focus();return}
  if(a==='pdish'||a==='pall'){
    const ing=b.dataset.ing,txt=b.closest('.ed').querySelector('textarea').value.trim();
    if(a==='pdish'){r.prep=r.prep||{};if(txt)r.prep[ing]=txt;else delete r.prep[ing];persist()}
    else{if(txt)T[ing]=txt;else delete T[ing];persistT()}
    redraw();toast(txt?'Đã lưu ghi chú ✓':'Đã xóa ghi chú');return}
  if(a==='cooked'){r.cooked=(r.cooked||0)+1;r.lastCooked=Date.now();toast('Giỏi quá, ghi nhận ✓')}
  if(a==='snooze'){r.snooze=Date.now()+DAY;toast('Ok, mai nhắc lại')}
  if(a==='del'){if(!confirm('Xóa món này khỏi sổ?'))return;R=R.filter(x=>x.id!==id)}
  if(a==='edit'){$('#note').value=r.text;editId=id;tab('note');live();$('#note').focus();return}
  persist();renderNag();updateCount();
  if(!$('#t-book').classList.contains('hide'))renderBook();
  if(!$('#t-fridge').classList.contains('hide'))renderFridge();
});

$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({recipes:R,tips:T},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='so-cong-thuc.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t),v=Array.isArray(o)?o:o.recipes;if(!Array.isArray(v))throw 0;if(o.tips&&typeof o.tips==='object'){Object.keys(o.tips).forEach(k=>{if(!T[k]&&typeof o.tips[k]==='string')T[k]=o.tips[k]});persistT()}const ids=new Set(R.map(x=>x.id));let n=0;v.forEach(x=>{if(x&&typeof x.text==='string'&&!ids.has(x.id)){R.push({id:x.id||Date.now()+n,created:x.created||Date.now(),cooked:x.cooked||0,lastCooked:x.lastCooked,prep:(x.prep&&typeof x.prep==='object')?x.prep:undefined,text:x.text});n++}});persist();renderBook();updateCount();renderNag();toast('Đã nhập '+n+' món')}catch(err){toast('File không đúng định dạng')}});e.target.value=''};
updateCount();renderNag();live();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
